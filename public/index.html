<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>СЛОВОБОЙ</title>
<style>
:root{--ink:#080d1a;--panel:#111a33;--amber:#ffb703;--mint:#2ee6a6;--coral:#ff4d6d;--ice:#d6e6ff}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;color:var(--ice);font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden;
 background:radial-gradient(900px 600px at 50% 35%,#16244a,transparent),var(--ink)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:22px 16px;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
h1{font:900 clamp(44px,12vw,76px)/1 'Arial Black','Segoe UI Black',Impact,sans-serif;text-align:center;color:var(--amber);letter-spacing:3px;text-shadow:0 0 24px #ffb70380,0 4px 0 #b37a00}
.card{background:var(--panel);border:2px solid #25345f;border-radius:6px 22px 6px 22px;padding:18px;box-shadow:0 0 0 1px #000,0 12px 40px #0009}
.sub{font-size:13px;opacity:.65;text-align:center;margin:6px 0}
input,button{font:inherit;width:100%;padding:14px 16px;border-radius:10px;border:2px solid #2c3d70;background:#0a1128;color:#fff;outline:none}
input:focus{border-color:var(--amber);box-shadow:0 0 0 4px #ffb70233}
button{cursor:pointer;font-weight:800;border:0;background:var(--amber);color:#1a1200;box-shadow:0 5px 0 #b37a00;transition:transform .08s,box-shadow .08s}
button:hover{transform:translateY(-2px);box-shadow:0 7px 0 #b37a00}
button:active{transform:translateY(4px);box-shadow:0 1px 0 #b37a00}
button.alt{background:var(--mint);box-shadow:0 5px 0 #17996f}
button:disabled{opacity:.4;pointer-events:none}
.row{display:flex;gap:10px;margin-top:12px}.row button{width:auto;white-space:nowrap}
.hide{display:none!important}.center{text-align:center}
.code{font:900 64px 'Arial Black',Impact,sans-serif;letter-spacing:10px;text-align:center;color:var(--mint);cursor:pointer;text-shadow:0 0 20px #2ee6a680}
.pls{display:flex;flex-direction:column;gap:6px;margin:12px 0}
.pl{display:flex;justify-content:space-between;padding:10px 14px;background:#0a1128;border-radius:8px;border-left:4px solid #2c3d70}
.pl.turn{border-left-color:var(--amber);background:#1c2750;box-shadow:0 0 18px #ffb70340}
.pl.dead{opacity:.35;text-decoration:line-through}
.rb{position:relative;width:min(70vw,250px);aspect-ratio:1;margin:4px auto}
.rb svg{position:absolute;inset:0;width:100%;height:100%}
.trk{fill:none;stroke:#1b2850;stroke-width:10}
.rg{fill:none;stroke-width:10;stroke-linecap:round;stroke-dasharray:565.5;transform:rotate(-90deg);transform-origin:center}
#letter{position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(80px,26vw,120px) 'Arial Black',Impact,sans-serif;color:#fff;text-shadow:0 0 30px var(--amber)}
#sec{position:absolute;left:0;right:0;bottom:12%;text-align:center;font-weight:800;opacity:.7}
.hist{font-size:14px;opacity:.8;display:flex;flex-wrap:wrap;gap:6px}
.hist span{background:#0a1128;border-radius:6px;padding:4px 9px}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pop{animation:pp .35s}@keyframes pp{50%{transform:scale(1.25)}}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-80px);z-index:5;padding:12px 20px;border-radius:10px;font-weight:800;background:var(--mint);color:#04261b;transition:transform .3s;max-width:92vw;text-align:center}
#toast.show{transform:translate(-50%,0)}#toast.bad{background:var(--coral);color:#fff}
#snd,#trk{position:fixed;top:12px;z-index:6;width:46px;padding:8px;font-size:20px;box-shadow:none}#snd{right:12px}#trk{right:66px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<canvas id="fx"></canvas><div id="toast"></div><button id="snd" title="Звук">🔊</button><button id="trk" title="Сменить музыку">🎵</button>
<main>
<h1>СЛОВОБОЙ</h1>
<section id="menu" class="card">
  <input id="name" maxlength="16" placeholder="Твой ник" autocomplete="off">
  <div class="row"><button id="bCreate">Создать комнату</button></div>
  <div class="row"><input id="code" inputmode="numeric" maxlength="5" placeholder="Код комнаты, 5 цифр" autocomplete="off"><button id="bJoin" class="alt">Войти</button></div>
</section>
<section id="lobby" class="card hide">
  <div class="sub">Код комнаты, нажми чтобы скопировать</div><div id="rcode" class="code"></div>
  <div id="lp" class="pls"></div>
  <button id="bStart">Начать игру</button><div id="wait" class="sub"></div>
</section>
<section id="game" class="hide">
  <div class="card center" id="gcard">
    <div class="rb" id="rb"><svg viewBox="0 0 200 200"><circle class="trk" cx="100" cy="100" r="90"/><circle id="ring" class="rg" cx="100" cy="100" r="90"/></svg><div id="letter">?</div><div id="sec"></div></div>
    <div id="hint" class="sub"></div>
    <input id="word" placeholder="Твое слово" maxlength="40" autocomplete="off">
  </div>
  <div class="card" style="margin-top:14px"><div id="gp" class="pls"></div><div id="hist" class="hist"></div></div>
</section>
<section id="over" class="card hide center">
  <div class="sub">Победитель</div><div id="win" class="code" style="letter-spacing:2px;font-size:44px;cursor:default"></div>
  <div id="note" class="sub" style="font-size:16px;color:var(--amber);opacity:1"></div><div id="op" class="pls"></div><button id="bAgain">Играть еще раз</button><div id="owait" class="sub"></div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
let ws, me = null, S = null, tLeft = 0, tAt = 0, lastTick = -1;

/* ---------- звук: все синтезируется, файлов нет ---------- */
let ac, sg, mg, musicOn = true;
function A() {
  if (!ac) {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    sg = ac.createGain(); sg.gain.value = .9; sg.connect(ac.destination);
    mg = ac.createGain(); mg.gain.value = .6; mg.connect(ac.destination);
    startMusic();
  }
  if (ac.state === 'suspended') ac.resume();
}
function tone(f, d = .15, type = 'sine', v = .2, when = 0, dest) {
  if (!ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(dest || sg); o.start(t); o.stop(t + d);
}
const TRACKS = [
  { n: 'Неон', ms: 260, w: 'triangle', v: .05, b: 'sine', pat: [0, 1, 2, 1], ch: [[220, 261.6, 329.6], [174.6, 220, 261.6], [261.6, 329.6, 392], [196, 246.9, 293.7]] },
  { n: 'Аркада', ms: 140, w: 'square', v: .03, b: 'square', pat: [0, 2, 1, 2], ch: [[261.6, 329.6, 392], [196, 246.9, 293.7], [220, 261.6, 329.6], [174.6, 220, 261.6]] },
  { n: 'Космос', ms: 520, w: 'sine', v: .07, b: 'sine', pat: [0, 1, 2, 1], ch: [[146.8, 220, 293.7], [130.8, 196, 261.6], [116.5, 174.6, 233.1], [110, 164.8, 220]] },
  { n: 'Погоня', ms: 170, w: 'sawtooth', v: .03, b: 'sawtooth', pat: [0, 1, 2, 1], ch: [[164.8, 196, 246.9], [130.8, 164.8, 196], [146.8, 185, 220], [123.5, 155.6, 185]] }
];
let trk = Math.floor(Math.random() * TRACKS.length), step = 0, mStarted = false;
function startMusic() {
  if (mStarted) return; mStarted = true;
  const tick = () => {
    const T = TRACKS[trk];
    if (musicOn && ac) {
      const ch = T.ch[(step >> 4) % 4], d = T.ms / 1000 * 1.8;
      tone(ch[T.pat[step % 4]] * 2, d, T.w, T.v, 0, mg);
      if (step % 4 === 0) tone(ch[0] / 2, d * 3, T.b, T.v * 1.6, 0, mg);
    }
    step++; setTimeout(tick, T.ms);
  };
  tick();
}
function nextTrack() { A(); trk = (trk + 1) % TRACKS.length; step = 0; musicOn = true; $('snd').textContent = '🔊'; toast('Музыка: ' + TRACKS[trk].n); }
const sfx = {
  ok() { tone(660, .12, 'triangle'); tone(880, .15, 'triangle', .2, .09); tone(1320, .25, 'triangle', .18, .18); },
  err() { tone(130, .3, 'sawtooth', .22); tone(95, .35, 'sawtooth', .2, .1); },
  out() { [520, 400, 300, 200].forEach((f, i) => tone(f, .2, 'square', .15, i * .12)); },
  join() { tone(500, .08, 'sine'); tone(750, .12, 'sine', .2, .07); },
  start() { [330, 440, 550, 660, 880].forEach((f, i) => tone(f, .18, 'triangle', .2, i * .07)); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, .3, 'triangle', .22, i * .11)); }
};
$('trk').onclick = () => nextTrack();
$('snd').onclick = () => { A(); musicOn = !musicOn; $('snd').textContent = musicOn ? '🔊' : '🔇'; };

/* ---------- частицы ---------- */
const cv = $('fx'), cx = cv.getContext('2d'); let W, H; const P = [];
function rs() { W = cv.width = innerWidth; H = cv.height = innerHeight; } rs(); addEventListener('resize', rs);
for (let i = 0; i < 55; i++) P.push({ x: Math.random() * innerWidth, y: Math.random() * innerHeight, vx: 0, vy: -(.1 + Math.random() * .4), r: 1 + Math.random() * 2, amb: 1 });
function burst(x, y, col, n = 45) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, s = 2 + Math.random() * 7; P.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: 2 + Math.random() * 3, life: 70 + Math.random() * 30, col }); }
}
function loop() {
  cx.clearRect(0, 0, W, H);
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.x += p.vx; p.y += p.vy;
    if (p.amb) { if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; } cx.globalAlpha = .3; cx.fillStyle = '#9db8ff'; }
    else { p.vy += .15; p.vx *= .98; if (--p.life <= 0) { P.splice(i, 1); continue; } cx.globalAlpha = Math.min(1, p.life / 40); cx.fillStyle = p.col; }
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.283); cx.fill();
  }
  cx.globalAlpha = 1; requestAnimationFrame(loop);
}
loop();
function centerBurst(col, n) { const b = $('rb').getBoundingClientRect(); burst(b.left + b.width / 2 || W / 2, b.top + b.height / 2 || H / 2, col, n); }

/* ---------- утилиты UI ---------- */
let tt;
function toast(msg, bad) { const t = $('toast'); t.textContent = msg; t.className = (bad ? 'bad ' : '') + 'show'; clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2200); }
function shake() { const c = $('gcard'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake'); }
function show(id) { ['menu', 'lobby', 'game', 'over'].forEach(s => $(s).classList.toggle('hide', s !== id)); }
function plist(el) {
  el.replaceChildren(...S.players.map(p => {
    const d = document.createElement('div');
    d.className = 'pl' + (p.id === S.turn ? ' turn' : '') + (p.alive ? '' : ' dead');
    const n = document.createElement('span'); n.textContent = p.name + (p.id === S.host ? ' 👑' : '') + (p.id === me ? ' (ты)' : '');
    const h = document.createElement('span'); h.textContent = S.phase === 'lobby' ? '' : '❤️'.repeat(Math.max(0, p.lives));
    d.append(n, h); return d;
  }));
}

/* ---------- сеть ---------- */
function connect(cb) {
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host);
  ws.onopen = cb;
  ws.onmessage = e => { try { onMsg(JSON.parse(e.data)); } catch {} };
  ws.onclose = () => { if (me) toast('Соединение потеряно', 1); me = null; S = null; show('menu'); };
}
const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };
function go(o) { A(); if (ws && ws.readyState === 1) send(o); else connect(() => send(o)); }

function onMsg(m) {
  if (m.t === 'joined') { me = m.id; sfx.join(); }
  else if (m.t === 'err') { shake(); sfx.err(); toast(m.msg, 1); }
  else if (m.t === 'ev') {
    if (m.k === 'ok') { sfx.ok(); centerBurst('#2ee6a6', 45); toast(m.name + ': ' + m.word.toUpperCase()); }
    else if (m.k === 'timeout') { sfx.out(); centerBurst('#ff4d6d', 40); toast(m.name + ' не успел, минус жизнь', 1); }
    else if (m.k === 'left') { sfx.out(); toast(m.name + ' вышел', 1); }
    else if (m.k === 'start') sfx.start();
    else if (m.k === 'over') { sfx.win(); for (let i = 0; i < 6; i++) setTimeout(() => burst(Math.random() * W, H * .3 + Math.random() * H * .3, ['#ffb703', '#2ee6a6', '#ff4d6d'][i % 3], 60), i * 220); }
  }
  else if (m.t === 'state') { S = m; tLeft = m.left; tAt = performance.now(); lastTick = -1; render(); }
}

function render() {
  if (S.phase === 'lobby') {
    show('lobby'); $('rcode').textContent = S.code; plist($('lp'));
    const host = S.host === me; $('bStart').classList.toggle('hide', !host);
    $('wait').textContent = host ? 'Нужно минимум 2 игрока' : 'Ждем, пока хост начнет игру';
  } else if (S.phase === 'play') {
    show('game');
    const my = S.turn === me;
    const L = $('letter'); L.textContent = S.letter ? S.letter.toUpperCase() : '?'; L.classList.remove('pop'); void L.offsetWidth; L.classList.add('pop');
    $('hint').textContent = my ? (S.letter ? 'Твой ход. Слово на «' + S.letter.toUpperCase() + '»' : 'Твой ход. Назови любое слово') : 'Ходит ' + S.players.find(p => p.id === S.turn).name;
    const w = $('word'); w.disabled = !my; w.placeholder = my ? 'Твое слово' : 'Ждем ход...'; if (my) { w.focus(); }
    plist($('gp'));
    $('hist').replaceChildren(...S.hist.map(h => { const s = document.createElement('span'); s.textContent = h.w; return s; }));
  } else {
    show('over'); $('win').textContent = S.winner || 'Ничья'; $('note').textContent = S.note ? 'Игрок ' + S.note + '. Авто-победа!' : ''; plist($('op'));
    const host = S.host === me; $('bAgain').classList.toggle('hide', !host); $('owait').textContent = host ? '' : 'Ждем решения хоста';
  }
}

function frame() {
  if (S && S.phase === 'play') {
    const left = Math.max(0, tLeft - (performance.now() - tAt)), f = left / S.total, s = Math.ceil(left / 1000);
    const r = $('ring'); r.style.strokeDashoffset = 565.5 * (1 - f);
    r.style.stroke = f > .5 ? '#2ee6a6' : f > .25 ? '#ffb703' : '#ff4d6d';
    $('sec').textContent = s;
    if (left < 5000 && s !== lastTick) { lastTick = s; tone(s <= 2 ? 1100 : 800, .06, 'square', .08); }
  }
  requestAnimationFrame(frame);
}
frame();

/* ---------- события ---------- */
$('bCreate').onclick = () => go({ t: 'create', name: $('name').value });
$('bJoin').onclick = () => go({ t: 'join', name: $('name').value, code: $('code').value });
$('code').oninput = e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 5); };
$('code').onkeydown = e => { if (e.key === 'Enter') $('bJoin').click(); };
$('bStart').onclick = () => send({ t: 'start' });
$('bAgain').onclick = () => send({ t: 'again' });
$('rcode').onclick = () => { try { navigator.clipboard.writeText(S.code); toast('Код скопирован'); } catch {} };
$('word').onkeydown = e => {
  if (e.key !== 'Enter') return;
  const v = e.target.value.trim(); if (!v) return;
  send({ t: 'word', w: v }); e.target.value = '';
};
</script></body></html>
